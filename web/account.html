<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản · Content Studio</title><link rel="stylesheet" href="/static/studio.css"><script defer src="/static/auth.js"></script><script defer src="/static/account.js"></script></head><body><main style="max-width:600px;margin:auto;padding:32px"><a href="/app">← Content Studio</a><h1>Tài khoản của bạn</h1><p id="account-name"></p><p id="notice" role="status"></p><form id="password-form"><h2>Đổi mật khẩu</h2><label for="old-password">Mật khẩu hiện tại</label><input id="old-password" type="password" autocomplete="current-password" required><label for="new-password">Mật khẩu mới · ít nhất 12 ký tự</label><input id="new-password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required><button type="submit" class="primary">Đổi mật khẩu</button></form><hr><form id="delete-form"><h2>Xóa tài khoản và dữ liệu</h2><p>Xóa phiên, ảnh, MP4, chat và lịch chưa gửi; ngắt TikTok. Bài đã đăng trên TikTok vẫn còn. Lượt đang gửi hoặc cần đối chiếu phải xử lý xong trước. Quản trị dự án không tự xóa ở đây.</p><label for="delete-name">Nhập đúng tên đăng nhập để xác nhận</label><input id="delete-name" autocomplete="username" required><label for="delete-password">Mật khẩu hiện tại</label><input id="delete-password" type="password" autocomplete="current-password" required><button type="submit">Xóa tài khoản và dữ liệu</button></form><p><a href="/policy">Quyền riêng tư và hỗ trợ</a></p></main></body></html>
