<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · Content Studio</title><link rel="stylesheet" href="/static/studio.css"><script defer src="/static/auth.js"></script></head><body><main style="max-width:520px;margin:5vh auto;padding:28px"><a href="/app">Content Studio</a><h1>Tài khoản của bạn</h1><p>Quản lý nội dung, video và lịch đăng riêng.</p><p id="auth-message" role="status"></p><form id="auth-form"><label for="auth-mode">Thao tác</label><select id="auth-mode"><option value="login">Đăng nhập</option><option value="register">Đăng ký</option><option value="recover">Khôi phục mật khẩu</option><option id="setup-option" value="setup" hidden>Thiết lập quản trị</option></select><label for="username">Tên đăng nhập</label><input id="username" name="username" minlength="3" maxlength="40" pattern="[a-zA-Z0-9_.-]+" autocomplete="username" required><label for="password">Mật khẩu · tối thiểu 12 ký tự</label><input id="password" name="password" type="password" minlength="12" maxlength="200" autocomplete="current-password" required><div id="recovery-field" hidden><label for="recovery">Mã khôi phục</label><input id="recovery" name="recovery" autocomplete="off"></div><p>Khi đăng ký, bạn xác nhận đã đọc <a href="/policy">quyền riêng tư và điều khoản sử dụng</a>.</p><button class="primary" type="submit">Tiếp tục</button></form><pre id="recovery-result" style="white-space:pre-wrap;overflow-wrap:anywhere" hidden></pre><a id="auth-next" class="primary" hidden href="/app">Tôi đã lưu mã · Tiếp tục</a></main></body></html>
