map $http_x_forwarded_proto $studio_proto {
    default $scheme;
    https https;
}
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=6r/m;
server {
    listen 80;
    server_name _;
    client_max_body_size 46m;
    # OAuth codes and signed media URLs must not enter access logs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $studio_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 180s;
    location = /api/v2/auth/setup { return 403; }
    location ~ ^/api/v2/auth/(login|register|recover)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://studio:8001;
    }
    location /api/v2/ { proxy_pass http://studio:8001; }
    location /static/ { proxy_pass http://studio:8001; }
    location = /app { proxy_pass http://studio:8001; }
    location = /login { proxy_pass http://studio:8001; }
    location = /policy { proxy_pass http://studio:8001; }
    location = /account { proxy_pass http://studio:8001; }
    location /media/tiktok/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://python-service:8000;
    }
    location ~ ^/tiktok[a-zA-Z0-9_-]+\.txt$ {
        root /verification;
        try_files $uri =404;
    }
    location = /webhook/telegram-video-callback-v2 {
        limit_except POST { deny all; }
        proxy_pass http://n8n:5678;
    }
    location = / { return 302 /app; }
    location / { return 404; }
}
